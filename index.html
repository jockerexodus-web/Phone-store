<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numéros Virtuels - Génération & Réception</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 600px;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      margin-top: 10px;
    }
    .btn-secondary:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    .number-card {
      background: #f8f9ff;
      border: 2px solid #667eea;
      border-radius: 15px;
      padding: 25px;
      margin: 20px 0;
      text-align: center;
      display: none;
    }
    .number-card.active { display: block; animation: fadeIn 0.4s; }
    .number-label { color: #666; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .number-value {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      margin: 10px 0;
      letter-spacing: 2px;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #d4edda;
      color: #155724;
    }

    .codes-section {
      margin-top: 25px;
      display: none;
    }
    .codes-section.active { display: block; }
    .codes-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .refresh-btn {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .code-item {
      background: #fff;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      animation: slideIn 0.3s;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    .code-sender { font-weight: 600; color: #667eea; }
    .code-content {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #333;
      font-family: monospace;
    }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #999;
      font-size: 14px;
    }
    .loading {
      text-align: center;
      padding: 15px;
      color: #667eea;
      font-size: 14px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    .copy-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 10px;
    }
    .auto-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #666;
    }
    .pulse {
      width: 8px; height: 8px;
      background: #4caf50;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Numéros Virtuels</h1>
    <p class="subtitle">Générez un numéro virtuel et recevez les codes SMS</p>

    <button class="btn" id="generateBtn">Générer un numéro virtuel</button>

    <div class="number-card" id="numberCard">
      <div class="number-label">Votre numéro virtuel</div>
      <div class="number-value" id="numberValue">+33 6 00 00 00 00</div>
      <span class="status">● Actif</span>
      <button class="btn btn-secondary" id="copyNumberBtn" style="margin-top:15px;">📋 Copier le numéro</button>
    </div>

    <div class="codes-section" id="codesSection">
      <div class="codes-title">
        <span>📨 Codes reçus</span>
        <div class="auto-refresh">
          <span class="pulse"></span>
          <button class="refresh-btn" id="refreshBtn">Actualiser</button>
        </div>
      </div>
      <div id="codesList">
        <div class="empty-state">Aucun code reçu pour le moment...</div>
      </div>
    </div>
  </div>

  <script>
    let currentNumber = null;
    let refreshInterval = null;

    const generateBtn = document.getElementById('generateBtn');
    const numberCard = document.getElementById('numberCard');
    const numberValue = document.getElementById('numberValue');
    const codesSection = document.getElementById('codesSection');
    const codesList = document.getElementById('codesList');
    const refreshBtn = document.getElementById('refreshBtn');
    const copyNumberBtn = document.getElementById('copyNumberBtn');

    generateBtn.addEventListener('click', async () => {
      generateBtn.disabled = true;
      generateBtn.textContent = '⏳ Génération en cours...';

      try {
        const res = await fetch('/api/numbers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'generate' })
        });
        const data = await res.json();

        currentNumber = data.number;
        numberValue.textContent = data.number;
        numberCard.classList.add('active');
        codesSection.classList.add('active');
        generateBtn.textContent = '🔄 Générer un nouveau numéro';

        await loadCodes();
        startAutoRefresh();
      } catch (err) {
        alert('Erreur : ' + err.message);
        generateBtn.textContent = 'Générer un numéro virtuel';
      }
      generateBtn.disabled = false;
    });

    copyNumberBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(currentNumber);
      copyNumberBtn.textContent = '✅ Copié !';
      setTimeout(() => copyNumberBtn.textContent = '📋 Copier le numéro', 1500);
    });

    refreshBtn.addEventListener('click', loadCodes);

    async function loadCodes() {
      if (!currentNumber) return;
      try {
        const res = await fetch(`/api/numbers?number=${encodeURIComponent(currentNumber)}`);
        const data = await res.json();
        renderCodes(data.codes || []);
      } catch (err) {
        console.error(err);
      }
    }

    function renderCodes(codes) {
      if (!codes.length) {
        codesList.innerHTML = '<div class="empty-state">Aucun code reçu pour le moment...</div>';
        return;
      }
      codesList.innerHTML = codes.map(c => `
        <div class="code-item">
          <div class="code-header">
            <span class="code-sender">${c.sender || 'Inconnu'}</span>
            <span>${new Date(c.timestamp).toLocaleString('fr-FR')}</span>
          </div>
          <div class="code-content">
            ${c.code}
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${c.code}')">Copier</button>
          </div>
        </div>
      `).join('');
    }

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(loadCodes, 5000);
    }
  </script>
</body>
</html>
